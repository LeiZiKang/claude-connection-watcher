name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test
        run: bash scripts/test.sh
      - name: Build Universal 2 preview package
        run: bash scripts/package-release.sh --preview
